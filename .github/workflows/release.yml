name: Publish preview release
on:
  push:
    branches: [main]
    paths: [.github/workflows/release.yml, package.json, docs/RELEASE.md, docs/campaign/assets/performance-showcase.mp4]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm pack
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const tag = `v${pkg.version}`;
            const { owner, repo } = context.repo;
            const body = fs.readFileSync('docs/RELEASE.md', 'utf8');
            let release;
            try { release = (await github.rest.repos.getReleaseByTag({owner, repo, tag})).data; }
            catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, target_commitish: context.sha,
                name: `Liquid Glass Kit ${pkg.version}`,
                prerelease: pkg.version.includes('-'), body
              })).data;
            }
            const packageFile = `wpsydev-liquid-glass-${pkg.version}.tgz`;
            const assets = [
              { path: packageFile, name: packageFile },
              { path: 'docs/campaign/assets/performance-showcase.mp4', name: 'liquid-glass-performance.mp4' }
            ];
            for (const asset of assets) {
              if (!fs.existsSync(asset.path)) {
                if (asset.path === packageFile) throw new Error(`Missing package ${packageFile}`);
                continue;
              }
              if (!release.assets.some(existing => existing.name === asset.name)) {
                await github.rest.repos.uploadReleaseAsset({owner, repo, release_id: release.id, name: asset.name, data: fs.readFileSync(asset.path)});
              }
            }
