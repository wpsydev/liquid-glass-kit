name: Publish preview release
on:
  push:
    branches: [main]
    paths: [.github/workflows/release.yml, package.json, docs/RELEASE.md, docs/RELEASE_ASSETS.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm pack
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const tag = `v${pkg.version}`;
            const { owner, repo } = context.repo;
            const body = fs.readFileSync('docs/RELEASE.md', 'utf8');
            let release;
            try { release = (await github.rest.repos.getReleaseByTag({owner, repo, tag})).data; }
            catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, target_commitish: context.sha,
                name: `Liquid Glass Kit ${pkg.version}`,
                prerelease: pkg.version.includes('-'), body
              })).data;
            }
            const packageFile = `wpsydev-liquid-glass-${pkg.version}.tgz`;
            const media = JSON.parse(fs.readFileSync('docs/RELEASE_ASSETS.json', 'utf8'));
            if (media.version !== pkg.version || !Array.isArray(media.assets)) throw new Error('Release media version mismatch');
            for (const asset of media.assets) {
              if (!/^docs\/campaign\/assets\/[a-z0-9][a-z0-9._-]*$/.test(asset.path) ||
                  !/^[a-z0-9][a-z0-9._-]*$/.test(asset.name) ||
                  !['video/mp4', 'image/png', 'image/webp', 'application/json'].includes(asset.type)) {
                throw new Error('Invalid release media descriptor');
              }
            }
            const assets = [{ path: packageFile, name: packageFile, type: 'application/gzip' }, ...media.assets];
            for (const asset of assets) {
              if (!fs.existsSync(asset.path)) {
                throw new Error(`Missing release artifact ${asset.path}`);
              }
              if (!release.assets.some(existing => existing.name === asset.name)) {
                await github.rest.repos.uploadReleaseAsset({owner, repo, release_id: release.id, name: asset.name, headers: { 'content-type': asset.type }, data: fs.readFileSync(asset.path)});
              }
            }
