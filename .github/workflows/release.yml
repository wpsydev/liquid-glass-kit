name: Publish preview release
on:
  push:
    branches: [main]
    paths: [.github/workflows/release.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm pack
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const tag = 'v0.1.0-preview.1';
            const { owner, repo } = context.repo;
            let release;
            try { release = (await github.rest.repos.getReleaseByTag({owner, repo, tag})).data; }
            catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, target_commitish: context.sha,
                name: 'Liquid Glass Kit 0.1.0 — Preview', prerelease: true,
                body: 'CSS-first Liquid Glass materials, a typed DOM controller, React/Vue adapters, a Svelte action, and agent integration guides.\n\nThe portable material is the default. SVG live-backdrop refraction is an opt-in experimental Chromium enhancement. See docs/COMPATIBILITY.md and docs/VALIDATION.md for evidence and limitations.\n\nnpm publication is pending; install from GitHub or the attached package archive. The archive was built after type checking and all tests passed.'
              })).data;
            }
            const name = 'wpsydev-liquid-glass-0.1.0.tgz';
            if (!release.assets.some(asset => asset.name === name)) {
              await github.rest.repos.uploadReleaseAsset({owner, repo, release_id: release.id, name, data: fs.readFileSync(name)});
            }
